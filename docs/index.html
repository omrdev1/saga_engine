<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saga Engine - Interactive Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-card: #1a1a24;
      --border: #2a2a3a;
      --text-primary: #ffffff;
      --text-secondary: #8888a0;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.3);
      --success: #22c55e;
      --success-glow: rgba(34, 197, 94, 0.3);
      --error: #ef4444;
      --error-glow: rgba(239, 68, 68, 0.3);
      --warning: #f59e0b;
      --rollback: #8b5cf6;
      --rollback-glow: rgba(139, 92, 246, 0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Background gradient */
    .bg-gradient {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background:
        radial-gradient(ellipse at 20% 20%, rgba(99, 102, 241, 0.1) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(139, 92, 246, 0.1) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
      position: relative;
      z-index: 1;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 60px;
    }

    .logo {
      font-size: 14px;
      font-weight: 600;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 48px;
      font-weight: 700;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #fff 0%, #8888a0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 18px;
      color: var(--text-secondary);
      max-width: 600px;
      margin: 0 auto;
    }

    /* Scenario selector */
    .scenarios {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 40px;
      flex-wrap: wrap;
    }

    .scenario-btn {
      padding: 12px 24px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .scenario-btn:hover {
      border-color: var(--accent);
      background: rgba(99, 102, 241, 0.1);
    }

    .scenario-btn.active {
      border-color: var(--accent);
      background: var(--accent);
    }

    .scenario-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Main demo area */
    .demo-container {
      display: grid;
      grid-template-columns: 1fr 400px;
      gap: 40px;
      align-items: start;
    }

    @media (max-width: 900px) {
      .demo-container {
        grid-template-columns: 1fr;
      }
    }

    /* Steps visualization */
    .steps-container {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
    }

    .steps-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .steps-title {
      font-size: 18px;
      font-weight: 600;
    }

    .status-badge {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .status-badge.idle { background: var(--bg-card); color: var(--text-secondary); }
    .status-badge.running { background: var(--accent-glow); color: var(--accent); }
    .status-badge.success { background: var(--success-glow); color: var(--success); }
    .status-badge.failed { background: var(--error-glow); color: var(--error); }
    .status-badge.rolling-back { background: var(--rollback-glow); color: var(--rollback); }

    /* Individual step */
    .step {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      padding: 20px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 12px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .step::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: var(--border);
      transition: all 0.3s ease;
    }

    .step.pending::before { background: var(--border); }
    .step.running::before { background: var(--accent); box-shadow: 0 0 20px var(--accent-glow); }
    .step.completed::before { background: var(--success); }
    .step.failed::before { background: var(--error); }
    .step.rolling-back::before { background: var(--rollback); animation: pulse 1s infinite; }
    .step.rolled-back::before { background: var(--text-secondary); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .step-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
      background: var(--bg-secondary);
      transition: all 0.3s ease;
    }

    .step.running .step-icon { background: var(--accent-glow); }
    .step.completed .step-icon { background: var(--success-glow); }
    .step.failed .step-icon { background: var(--error-glow); }
    .step.rolling-back .step-icon { background: var(--rollback-glow); }

    .step-content {
      flex: 1;
      min-width: 0;
    }

    .step-name {
      font-weight: 600;
      margin-bottom: 4px;
    }

    .step-description {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .step-status {
      font-size: 12px;
      font-weight: 500;
      padding: 4px 8px;
      border-radius: 4px;
      white-space: nowrap;
    }

    .step.pending .step-status { color: var(--text-secondary); }
    .step.running .step-status { color: var(--accent); }
    .step.completed .step-status { color: var(--success); }
    .step.failed .step-status { color: var(--error); }
    .step.rolling-back .step-status { color: var(--rollback); }
    .step.rolled-back .step-status { color: var(--text-secondary); }

    /* Connector line */
    .step-connector {
      width: 2px;
      height: 20px;
      background: var(--border);
      margin-left: 35px;
      margin-bottom: 12px;
    }

    /* Log panel */
    .log-panel {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      height: fit-content;
      position: sticky;
      top: 20px;
    }

    .log-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .log-content {
      height: 400px;
      overflow-y: auto;
      padding: 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      line-height: 1.8;
    }

    .log-entry {
      padding: 4px 0;
      opacity: 0;
      animation: fadeIn 0.3s ease forwards;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    .log-entry.info { color: var(--text-secondary); }
    .log-entry.success { color: var(--success); }
    .log-entry.error { color: var(--error); }
    .log-entry.rollback { color: var(--rollback); }
    .log-entry.step { color: var(--accent); }

    .log-time {
      color: var(--text-secondary);
      margin-right: 8px;
    }

    /* Run button */
    .run-container {
      text-align: center;
      margin-top: 32px;
    }

    .run-btn {
      padding: 16px 48px;
      font-size: 16px;
      font-weight: 600;
      font-family: inherit;
      background: linear-gradient(135deg, var(--accent) 0%, #8b5cf6 100%);
      border: none;
      border-radius: 12px;
      color: white;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 20px var(--accent-glow);
    }

    .run-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 30px var(--accent-glow);
    }

    .run-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* Footer */
    footer {
      text-align: center;
      margin-top: 60px;
      padding: 20px;
      color: var(--text-secondary);
      font-size: 14px;
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    /* Code snippet */
    .code-snippet {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-top: 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--text-secondary);
      overflow-x: auto;
    }

    .code-snippet code {
      color: var(--accent);
    }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid transparent;
      border-top-color: currentColor;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Result message */
    .result-message {
      text-align: center;
      padding: 20px;
      margin-top: 20px;
      border-radius: 12px;
      font-weight: 500;
      animation: fadeIn 0.5s ease;
    }

    .result-message.success {
      background: var(--success-glow);
      color: var(--success);
    }

    .result-message.error {
      background: var(--error-glow);
      color: var(--error);
    }
  </style>
</head>
<body>
  <div class="bg-gradient"></div>

  <div class="container">
    <header>
      <div class="logo">Saga Engine</div>
      <h1>Durable Workflows</h1>
      <p class="subtitle">Watch the Saga pattern in action. If any step fails, all previous steps are automatically rolled back.</p>
    </header>

    <div class="scenarios">
      <button class="scenario-btn active" data-scenario="success">Success Flow</button>
      <button class="scenario-btn" data-scenario="failure">Failure + Rollback</button>
      <button class="scenario-btn" data-scenario="timeout">Timeout Handling</button>
    </div>

    <div class="demo-container">
      <div class="steps-container">
        <div class="steps-header">
          <span class="steps-title">Order Fulfillment Workflow</span>
          <span class="status-badge idle" id="workflow-status">Idle</span>
        </div>

        <div id="steps-list">
          <!-- Steps will be rendered here -->
        </div>

        <div class="run-container">
          <button class="run-btn" id="run-btn">Run Workflow</button>
        </div>

        <div id="result-container"></div>

        <div class="code-snippet">
          <code>npm install saga-engine</code>
        </div>
      </div>

      <div class="log-panel">
        <div class="log-header">
          <span>Live Execution Log</span>
        </div>
        <div class="log-content" id="log-content">
          <div class="log-entry info">Waiting to start...</div>
        </div>
      </div>
    </div>

    <footer>
      Built with <a href="https://github.com/Grafikui/saga-engine" target="_blank">saga-engine</a>
      &mdash; Durable saga orchestration for Node.js
    </footer>
  </div>

  <script>
    // ═══════════════════════════════════════════════════════════════════════
    // WORKFLOW CONFIGURATION
    // ═══════════════════════════════════════════════════════════════════════

    const STEPS = [
      { id: 'inventory', icon: '📦', name: 'Reserve Inventory', description: 'Lock items in warehouse system' },
      { id: 'payment', icon: '💳', name: 'Process Payment', description: 'Charge customer payment method' },
      { id: 'shipment', icon: '🚚', name: 'Create Shipment', description: 'Generate shipping label and tracking' },
      { id: 'email', icon: '📧', name: 'Send Confirmation', description: 'Email order confirmation to customer' },
      { id: 'analytics', icon: '📊', name: 'Track Analytics', description: 'Record order metrics for reporting' },
    ];

    const SCENARIOS = {
      success: { failAt: null, timeout: false, description: 'All steps complete successfully' },
      failure: { failAt: 'email', timeout: false, description: 'Email step fails, triggering rollback' },
      timeout: { failAt: null, timeout: 'payment', description: 'Payment processing times out' },
    };

    // ═══════════════════════════════════════════════════════════════════════
    // STATE
    // ═══════════════════════════════════════════════════════════════════════

    let currentScenario = 'success';
    let isRunning = false;
    let stepStates = {};

    // ═══════════════════════════════════════════════════════════════════════
    // DOM ELEMENTS
    // ═══════════════════════════════════════════════════════════════════════

    const stepsContainer = document.getElementById('steps-list');
    const logContent = document.getElementById('log-content');
    const runBtn = document.getElementById('run-btn');
    const workflowStatus = document.getElementById('workflow-status');
    const resultContainer = document.getElementById('result-container');
    const scenarioBtns = document.querySelectorAll('.scenario-btn');

    // ═══════════════════════════════════════════════════════════════════════
    // RENDERING
    // ═══════════════════════════════════════════════════════════════════════

    function renderSteps() {
      stepsContainer.innerHTML = STEPS.map((step, index) => `
        <div class="step ${stepStates[step.id] || 'pending'}" id="step-${step.id}">
          <div class="step-icon">${step.icon}</div>
          <div class="step-content">
            <div class="step-name">${step.name}</div>
            <div class="step-description">${step.description}</div>
          </div>
          <div class="step-status">${getStatusText(stepStates[step.id] || 'pending')}</div>
        </div>
        ${index < STEPS.length - 1 ? '<div class="step-connector"></div>' : ''}
      `).join('');
    }

    function getStatusText(state) {
      const texts = {
        pending: 'Pending',
        running: '<span class="spinner"></span> Running',
        completed: '✓ Completed',
        failed: '✗ Failed',
        'rolling-back': '↩ Rolling back',
        'rolled-back': '↩ Rolled back',
      };
      return texts[state] || state;
    }

    function setWorkflowStatus(status) {
      workflowStatus.className = `status-badge ${status}`;
      workflowStatus.textContent = status.charAt(0).toUpperCase() + status.slice(1).replace('-', ' ');
    }

    function log(message, type = 'info') {
      const time = new Date().toLocaleTimeString('en-US', { hour12: false });
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      entry.innerHTML = `<span class="log-time">${time}</span>${message}`;
      logContent.appendChild(entry);
      logContent.scrollTop = logContent.scrollHeight;
    }

    function clearLogs() {
      logContent.innerHTML = '';
    }

    function showResult(success, message) {
      resultContainer.innerHTML = `
        <div class="result-message ${success ? 'success' : 'error'}">
          ${message}
        </div>
      `;
    }

    // ═══════════════════════════════════════════════════════════════════════
    // WORKFLOW SIMULATION
    // ═══════════════════════════════════════════════════════════════════════

    async function delay(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function runStep(step, scenario) {
      stepStates[step.id] = 'running';
      renderSteps();
      log(`Executing: ${step.name}...`, 'step');

      // Simulate work
      const workTime = 800 + Math.random() * 400;

      // Check for timeout scenario
      if (scenario.timeout === step.id) {
        log(`Step "${step.name}" is taking too long...`, 'info');
        await delay(1500);
        stepStates[step.id] = 'failed';
        renderSteps();
        log(`TIMEOUT: ${step.name} exceeded 2000ms limit`, 'error');
        throw new Error(`Timeout: ${step.name}`);
      }

      await delay(workTime);

      // Check for failure scenario
      if (scenario.failAt === step.id) {
        stepStates[step.id] = 'failed';
        renderSteps();
        log(`FAILED: ${step.name} - Service unavailable`, 'error');
        throw new Error(`${step.name} failed`);
      }

      stepStates[step.id] = 'completed';
      renderSteps();
      log(`Completed: ${step.name} (${Math.round(workTime)}ms)`, 'success');
    }

    async function rollbackStep(step) {
      stepStates[step.id] = 'rolling-back';
      renderSteps();
      log(`Rolling back: ${step.name}...`, 'rollback');

      await delay(300 + Math.random() * 200);

      stepStates[step.id] = 'rolled-back';
      renderSteps();
      log(`Rolled back: ${step.name}`, 'rollback');
    }

    async function runWorkflow() {
      const scenario = SCENARIOS[currentScenario];
      const completedSteps = [];

      // Reset state
      stepStates = {};
      renderSteps();
      clearLogs();
      resultContainer.innerHTML = '';

      isRunning = true;
      runBtn.disabled = true;
      scenarioBtns.forEach(btn => btn.disabled = true);
      setWorkflowStatus('running');

      log(`Starting transaction: support-ticket-${Date.now()}`, 'info');
      log(`Scenario: ${scenario.description}`, 'info');

      try {
        for (const step of STEPS) {
          await runStep(step, scenario);
          completedSteps.push(step);
        }

        setWorkflowStatus('success');
        log('Transaction completed successfully!', 'success');
        showResult(true, '✓ All steps completed successfully. No rollback needed.');

      } catch (error) {
        setWorkflowStatus('rolling-back');
        log('Transaction failed. Starting automatic rollback...', 'error');

        // Rollback in reverse order (excluding the failed step)
        const stepsToRollback = [...completedSteps].reverse();

        for (const step of stepsToRollback) {
          await rollbackStep(step);
        }

        setWorkflowStatus('failed');
        log('Rollback complete. All changes have been reverted.', 'rollback');
        showResult(false, `✗ Transaction failed at "${STEPS.find(s => scenario.failAt === s.id || scenario.timeout === s.id)?.name}". All ${completedSteps.length} completed steps were rolled back.`);
      }

      isRunning = false;
      runBtn.disabled = false;
      scenarioBtns.forEach(btn => btn.disabled = false);
    }

    // ═══════════════════════════════════════════════════════════════════════
    // EVENT HANDLERS
    // ═══════════════════════════════════════════════════════════════════════

    scenarioBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        if (isRunning) return;

        scenarioBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentScenario = btn.dataset.scenario;

        // Reset UI
        stepStates = {};
        renderSteps();
        clearLogs();
        resultContainer.innerHTML = '';
        setWorkflowStatus('idle');
        log(`Scenario selected: ${SCENARIOS[currentScenario].description}`, 'info');
      });
    });

    runBtn.addEventListener('click', runWorkflow);

    // Initial render
    renderSteps();
  </script>
</body>
</html>
